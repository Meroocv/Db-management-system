{% extends 'base.html' %}

{% block conteudo %}
    <div class="container mt-4">
        <h2>Servidores Autorizados no Sistema</h2>
        <hr>

        <!-- Botão para abrir o modal de cadastro que criamos antes -->
        <button type="button" class="btn btn-success mb-3" onclick="abrirModalServidor()">
            + Novo Servidor
        </button>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th style="width: 50%;">Nome</th>        <!-- Dá 50% da largura para o Nome -->
                    <th style="width: 20%;">CPF</th>         <!-- 20% para o CPF -->
                    <th style="width: 20%;">CBO / Cargo</th> <!-- 20% para o CBO -->
                    <th style="width: 10%;">Ações</th>       <!-- 10% para o botão -->
                </tr>
            </thead>
            <tbody>
                {% for serv in servidores %}
                <tr>
                    <td>{{ serv.nome }}</td>  <!-- Atributo 'nome' do BaseServidores -->
                    <td>{{ serv.cpf }}</td>   <!-- Atributo 'cpf' do BaseServidores -->
                    <td>{{ serv.cbo }}</td>   <!-- Atributo 'cbo' do BaseServidores -->
                    <td>
                        <button type="button" class="btn btn-danger btn-sm" onclick="excluirServidor({{ serv.id }})">
                            🗑️ Excluir
                        </button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum servidor pré-cadastrado no sistema.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <a href="/" class="btn btn-secondary mt-3">Voltar ao Início</a>
    </div>

    <!-- Inclua aqui o seu modal de cadastro de novo servidor que fizemos anteriormente -->

    <script>
        function excluirServidor(id) {
            if (confirm("Tem certeza que deseja apagar este servidor do sistema? Essa ação não poderá ser desfeita.")) {
                fetch(`/excluir_servidor/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.mensagem);
                    location.reload(); // Recarrega a página para atualizar a tabela
                })
                .catch(err => {
                    console.error('Erro:', err);
                    alert('Erro ao tentar excluir o servidor.');
                });
            }
        }
    </script>



{% endblock %}
